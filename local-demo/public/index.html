<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f8f5">
    <meta name="description" content="Responsive smart irrigation system demo dashboard.">
    <title>Verdant — Irrigation monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#" aria-label="Verdant home">
          <span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M25.9 5.5C15.4 5.7 8.5 9.3 8.5 17c0 4 2.4 6.6 6.2 6.6 8.3 0 10.7-9.5 11.2-18.1ZM7.2 24.8c2.7-5.3 6.3-8.8 11.8-12" /></svg></span>
          <span class="brand-name">verdant<span>.</span></span>
        </a>
        <div class="sidebar-label">WORKSPACE</div>
        <nav class="side-nav" aria-label="Main navigation">
          <button class="nav-item active" data-page="dashboard"><span class="nav-icon">◫</span><span>Overview</span></button>
          <button class="nav-item" data-page="fields"><span class="nav-icon">⌖</span><span>Fields</span><span class="nav-count">2</span></button>
          <button class="nav-item" data-page="usage"><span class="nav-icon">⌁</span><span>Water usage</span></button>
          <button class="nav-item" data-page="activity"><span class="nav-icon">◷</span><span>Activity</span></button>
        </nav>
        <div class="sidebar-spacer"></div>
        <div class="sidebar-system">
          <span class="system-icon">✳</span>
          <div><strong>Greenhouse 01</strong><small><i class="live-dot"></i>Demo system online</small></div>
          <span class="more-icon">···</span>
        </div>
        <div class="profile">
          <div class="avatar">G</div>
          <div class="profile-name"><strong>Garden owner</strong><small>Personal plan</small></div>
          <span class="more-icon">⌄</span>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="breadcrumb"><span>Greenhouse 01</span><span class="breadcrumb-sep">/</span><strong id="breadcrumb-page">Overview</strong></div>
          <div class="topbar-right">
            <span class="demo-pill"><i></i> SIMULATION</span>
            <button id="alerts-button" class="icon-button" aria-label="Show activity" title="Show activity">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" /></svg>
              <span class="notification-dot"></span>
            </button>
            <div class="top-avatar">G</div>
          </div>
        </header>

        <div id="connection-banner" class="connection-banner" hidden>
          <span>Connection interrupted. Trying to reconnect…</span>
        </div>

        <section id="page-content" class="page-content" aria-live="polite">
          <div class="loading"><span class="spinner"></span>Connecting to your garden…</div>
        </section>

        <footer class="footer">
          <span><i class="live-dot"></i> Simulation active</span>
          <span>Last synced <strong id="last-synced">just now</strong></span>
        </footer>
      </main>

      <nav class="mobile-nav" aria-label="Main navigation">
        <button class="mobile-nav-item active" data-page="dashboard"><span>◫</span>Home</button>
        <button class="mobile-nav-item" data-page="fields"><span>⌖</span>Fields</button>
        <button class="mobile-nav-item" data-page="usage"><span>⌁</span>Usage</button>
        <button class="mobile-nav-item" data-page="activity"><span>◷</span>Activity</button>
      </nav>
      <div id="toast" class="toast" role="status"></div>
    </div>
  </body>
</html>
